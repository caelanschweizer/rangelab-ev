name: rangelab-ev

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${RANGELAB_DB_NAME:-rangelab}
      POSTGRES_USER: ${RANGELAB_DB_USER:-rangelab}
      POSTGRES_PASSWORD: ${RANGELAB_DB_PASSWORD:-local-development-only}
    volumes:
      - rangelab-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      RANGELAB_DATABASE_URL: postgresql+psycopg://${RANGELAB_DB_USER:-rangelab}:${RANGELAB_DB_PASSWORD:-local-development-only}@database:5432/${RANGELAB_DB_NAME:-rangelab}
      RANGELAB_CORS_ORIGINS: ${RANGELAB_CORS_ORIGINS:-http://localhost:3000}
      RANGELAB_MAX_UPLOAD_BYTES: ${RANGELAB_MAX_UPLOAD_BYTES:-10000000}
      RANGELAB_TRIP_GAP_MINUTES: ${RANGELAB_TRIP_GAP_MINUTES:-15}
      # Public fallback is only for the disposable, loopback development stack.
      RANGELAB_IDENTITY_SECRET: ${RANGELAB_IDENTITY_SECRET:-rangelab-local-only-identity-secret-change-before-real-data}
    ports:
      # The API has no authentication. Loopback publication is intentional.
      - "${RANGELAB_BIND_HOST:-127.0.0.1}:${RANGELAB_API_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
    ports:
      - "${RANGELAB_BIND_HOST:-127.0.0.1}:${RANGELAB_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rangelab-postgres:
