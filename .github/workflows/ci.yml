name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build and test
        run: pnpm test

  api:
    name: API pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install API and test dependencies
        run: python -m pip install -e "./backend[dev]"

      - name: Verify resolved dependencies
        run: python -m pip check

      - name: Run tests
        working-directory: backend
        run: pytest --cov=rangelab --cov-branch --cov-report=term-missing --cov-fail-under=85

  api-postgres:
    name: API PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rangelab
          POSTGRES_USER: rangelab
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rangelab -d rangelab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install API with PostgreSQL driver
        run: python -m pip install -e "./backend[postgres]"

      - name: Verify resolved dependencies
        run: python -m pip check

      - name: Exercise API against PostgreSQL
        env:
          RANGELAB_DATABASE_URL: postgresql+psycopg://rangelab:ci-only-password@127.0.0.1:5432/rangelab
          RANGELAB_CORS_ORIGINS: http://127.0.0.1:3000
          RANGELAB_IDENTITY_SECRET: ci-only-identity-secret-not-for-production-2026
        run: |
          set -euo pipefail
          uvicorn rangelab.api:app --host 127.0.0.1 --port 8000 >"$RUNNER_TEMP/rangelab-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >"$RUNNER_TEMP/health.json"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/rangelab-api.log"
            exit 1
          fi

          python -c 'import json, sys; assert json.load(sys.stdin)["database"] == "postgresql"' <"$RUNNER_TEMP/health.json"
          curl --fail --silent --show-error -X POST http://127.0.0.1:8000/api/v1/imports/csv \
            -H "Idempotency-Key: ci-postgres-synthetic" \
            -F "file=@data/synthetic_bolt_trips.csv;type=text/csv" \
            -F 'privacy_options={"enabled":true,"zones":[{"name":"ci-zone","latitude":43.945,"longitude":-78.896,"radius_m":500}],"coordinate_precision":4,"mask_coordinates_in_zones":true,"shift_timestamps":false}' \
            >"$RUNNER_TEMP/import.json"
          curl --fail --silent --show-error -X POST http://127.0.0.1:8000/api/v1/imports/csv \
            -H "Idempotency-Key: ci-postgres-synthetic" \
            -F "file=@data/synthetic_bolt_trips.csv;type=text/csv" \
            -F 'privacy_options={"enabled":true,"zones":[{"name":"ci-zone","latitude":43.945,"longitude":-78.896,"radius_m":500}],"coordinate_precision":4,"mask_coordinates_in_zones":true,"shift_timestamps":false}' \
            >"$RUNNER_TEMP/replay.json"
          python -c 'import json, pathlib, sys, uuid; first=json.loads(pathlib.Path(sys.argv[1]).read_text()); replay=json.loads(pathlib.Path(sys.argv[2]).read_text()); record=first["import_record"]; assert record["accepted_rows"] == 1908; assert record["privacy_masked_points"] > 0; assert len(first["trips"]) == 16; assert uuid.UUID(record["id"]).version == 4; assert all(uuid.UUID(trip["id"]).version == 4 for trip in first["trips"]); assert "content_sha256" not in record and "request_sha256" not in record; assert replay["import_record"]["id"] == record["id"]; assert replay["import_record"]["idempotent_replay"] is True' "$RUNNER_TEMP/import.json" "$RUNNER_TEMP/replay.json"
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/summary \
            | python -c 'import json, sys; assert json.load(sys.stdin)["trip_count"] == 16'

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [web, api, api-postgres]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: rangelab-ev-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: rangelab-ev-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
